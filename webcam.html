<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>RedOT Webcam</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');

:root {
  --u: 0.1vw;            /* 1 unidade = 1/1000 da largura do widget */
  --fire: #ff4a1c;       /* cor das chamas/brilho */
  --gold: #f2c45a;
  --gold-dark: #8a5a17;
  --k: .62;              /* escala da moldura (fatia de 130px do banner) */
  --kb: .34;             /* escala da moldura da barra */
  --logo-w: 230;         /* largura do logo (em unidades) */
  --partner-h: 118;      /* altura do logo parceiro (em unidades) */
  --top: 104;            /* espaço acima da moldura (para o logo) */
  --bar-h: 86;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

#cam {
  position: relative;
  width: 100%; height: 100%;
  font-family: 'Cinzel', serif;
  animation: entrance 1.4s cubic-bezier(.2, .9, .3, 1.2) both;
}
@keyframes entrance {
  0% { opacity: 0; transform: scale(.94); filter: brightness(3); }
  60% { opacity: 1; filter: brightness(1.4); }
  100% { opacity: 1; transform: scale(1); filter: none; }
}

#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

/* ---------------- moldura ---------------- */
#frame {
  position: absolute;
  top: calc(var(--top) * var(--u));
  left: calc(16 * var(--u)); right: calc(16 * var(--u));
  bottom: calc((var(--bar-h) + 22) * var(--u));
  z-index: 1;
}
#frame .border, #frame .shine {
  position: absolute;
  inset: calc(-28 * var(--k) * var(--u));
  border-style: solid;
  border-width: calc(130 * var(--k) * var(--u));
}

  background: linear-gradient(115deg, transparent 42%, rgba(255, 244, 200, .0) 45%, rgba(255, 236, 180, .55) 50%, rgba(255, 244, 200, 0) 55%, transparent 58%) border-box;
  background-size: 300% 300%;

  animation: shine 6s ease-in-out infinite;
}
@keyframes shine {
  0%, 15% { background-position: 110% 0; }
  65%, 100% { background-position: -10% 0; }
}
/* brilho vermelho pulsando (dentro e fora) */
#frame .glow {
  position: absolute; inset: calc(6 * var(--u));
  border-radius: calc(10 * var(--u));
  box-shadow:
    0 0 calc(26 * var(--u)) calc(2 * var(--u)) color-mix(in srgb, var(--fire) 55%, transparent),
    inset 0 0 calc(30 * var(--u)) color-mix(in srgb, var(--fire) 45%, transparent);
  animation: pulse 3.2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

.gem { position: absolute; filter: drop-shadow(0 0 calc(5 * var(--u)) var(--fire)); animation: gem 3.2s ease-in-out infinite; }
.gem.top, .gem.bottom { width: calc(340 * var(--k) * var(--u)); left: 50%; margin-left: calc(-170 * var(--k) * var(--u)); }
.gem.left, .gem.right { height: calc(260 * var(--k) * var(--u)); top: 50%; margin-top: calc(-130 * var(--k) * var(--u)); }
.gem.top { top: calc(-28 * var(--k) * var(--u)); }
.gem.bottom { bottom: calc(-28 * var(--k) * var(--u)); transform: scaleY(-1); }
.gem.left { left: calc(-28 * var(--k) * var(--u)); }
.gem.right { right: calc(-28 * var(--k) * var(--u)); transform: scaleX(-1); }
@keyframes gem {
  0%, 100% { filter: drop-shadow(0 0 calc(3 * var(--u)) var(--fire)); }
  50% { filter: drop-shadow(0 0 calc(10 * var(--u)) var(--fire)) brightness(1.25); }
}
.no-partner .gem.bottom { display: block; }
#cam:not(.no-partner) .gem.bottom { display: none; }

/* ---------------- logo ---------------- */
#logo {
  position: absolute; z-index: 4;
  top: calc(14 * var(--u)); left: 50%;
  width: calc(var(--logo-w) * var(--u));
  transform: translateX(-50%);
  animation: float 5s ease-in-out infinite;
}
#logo img {
  display: block; width: 100%;
  filter: drop-shadow(0 calc(4 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, .85)) drop-shadow(0 0 calc(10 * var(--u)) color-mix(in srgb, var(--fire) 60%, transparent));
  animation: breathe 3.2s ease-in-out infinite;
}
@keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, calc(-4 * var(--u))); } }
@keyframes breathe { 50% { filter: drop-shadow(0 calc(4 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, .85)) drop-shadow(0 0 calc(22 * var(--u)) var(--fire)) brightness(1.08); } }
.alerting #logo img { animation: logo-hit .9s ease-out 1, breathe 1s ease-in-out infinite .9s; }
@keyframes logo-hit { 0% { transform: scale(1); } 25% { transform: scale(1.12) rotate(-1.5deg); filter: brightness(1.8) drop-shadow(0 0 calc(30 * var(--u)) var(--fire)); } 100% { transform: scale(1); } }

/* ---------------- barra ---------------- */
#bar {
  position: absolute; z-index: 4;
  left: calc(16 * var(--u)); right: calc(16 * var(--u));
  bottom: calc(10 * var(--u));
  height: calc(var(--bar-h) * var(--u));
  display: flex; align-items: center;
  padding: 0 calc(30 * var(--u));
}
.bar-bg { position: absolute; inset: 0; z-index: -1; }
.bar-bg::before {
  content: ''; position: absolute; inset: calc(4 * var(--u));

  filter: drop-shadow(0 0 calc(6 * var(--u)) rgba(0, 0, 0, .9));
}

.slot { flex: 1; display: flex; align-items: baseline; gap: calc(8 * var(--u)); min-width: 0; white-space: nowrap; transition: opacity .4s; }
.slot.right { justify-content: flex-start; padding-left: calc(var(--partner-h) * .56 * var(--u)); }
#slot-follow { padding-right: calc(var(--partner-h) * .56 * var(--u)); }
.label {
  font-size: calc(18 * var(--u)); font-weight: 900; letter-spacing: .02em;
  background: linear-gradient(#fff3c4, var(--gold) 45%, var(--gold-dark));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 calc(2 * var(--u)) 0 rgba(0, 0, 0, .9));
}
.value {
  font-size: calc(21 * var(--u)); font-weight: 700; color: #fff;
  overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 calc(2 * var(--u)) calc(3 * var(--u)) #000, 0 0 calc(10 * var(--u)) color-mix(in srgb, var(--fire) 70%, transparent);
}
.value.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { color: var(--gold); transform: scale(1.25); text-shadow: 0 0 calc(18 * var(--u)) var(--fire); } 100% { color: #fff; transform: scale(1); } }

#partner {
  position: absolute; left: 50%; bottom: calc(6 * var(--u));
  height: calc(var(--partner-h) * var(--u));
  transform: translateX(-50%);
  transition: opacity .4s, transform .4s;
}
#partner img { height: 100%; display: block; filter: drop-shadow(0 calc(3 * var(--u)) calc(5 * var(--u)) rgba(0, 0, 0, .9)); animation: partner 6s ease-in-out infinite; }
@keyframes partner { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-4deg) scale(1.05); } 90% { transform: rotate(3deg) scale(1.05); } 95% { transform: rotate(0) scale(1); } }
.no-partner #partner { display: none; }
.no-partner .slot.right, .no-partner #slot-follow { padding-left: 0; padding-right: 0; }
.no-partner .slot.right { justify-content: flex-end; }

/* ---------------- alerta ---------------- */
#alert {
  position: absolute; inset: calc(5 * var(--u)) calc(14 * var(--u));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--fire) 75%, transparent), transparent 70%),
    linear-gradient(#2a0503, #120201);
  border-radius: calc(6 * var(--u));
  opacity: 0; transform: translateY(40%) scaleY(.4);
  transition: opacity .35s, transform .5s cubic-bezier(.2, 1.4, .4, 1);
  pointer-events: none; overflow: hidden;
}
#alert::after { /* reflexo passando */
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 40%, rgba(255, 230, 170, .35) 50%, transparent 60%) no-repeat;
  background-size: 250% 100%; background-position: 150% 0;
}
.alerting #alert { opacity: 1; transform: none; }
.alerting #alert::after { animation: sweep 1.4s ease-out .3s; }
@keyframes sweep { to { background-position: -50% 0; } }
.alerting .slot, .alerting #partner { opacity: 0; }
.alerting #partner { transform: translateX(-50%) translateY(30%); }
.alert-title {
  font-size: calc(20 * var(--u)); font-weight: 900; letter-spacing: .14em;
  background: linear-gradient(#fff3c4, var(--gold) 50%, var(--gold-dark));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.alert-name {
  font-size: calc(32 * var(--u)); font-weight: 900; color: #fff; line-height: 1.05;
  text-shadow: 0 0 calc(14 * var(--u)) var(--fire), 0 calc(2 * var(--u)) calc(3 * var(--u)) #000;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.alert-msg { font-size: calc(15 * var(--u)); color: #ffd9b0; font-family: Georgia, serif; font-style: italic; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-msg:empty { display: none; }
</style>

<script>let fd = {};
const queue = [];
let busy = false;
let burst = 0;            // frames de chama turbinada (alerta)

const $ = (id) => document.getElementById(id);

window.addEventListener('onWidgetLoad', (obj) => {
  fd = obj.detail.fieldData || {};
  const root = document.documentElement.style;
  if (fd.fireColor) root.setProperty('--fire', fd.fireColor);
  if (fd.goldColor) root.setProperty('--gold', fd.goldColor);
  if (fd.logoSize) root.setProperty('--logo-w', fd.logoSize);
  if (fd.partnerSize) root.setProperty('--partner-h', fd.partnerSize);
  if (fd.logoImage) $('logo-img').src = fd.logoImage;
  if (fd.partnerImage) $('partner-img').src = fd.partnerImage;
  if (fd.showPartner === 'no') $('cam').classList.add('no-partner');

  $('follow-label').textContent = fd.followLabel || 'ÚLTIMO SEGUIDOR:';
  $('donate-label').textContent = fd.donateLabel || 'ÚLTIMO DONATE:';

  // valores salvos na sessão do StreamElements
  const s = (obj.detail.session && obj.detail.session.data) || {};
  const f = s['follower-latest'];
  const t = s['tip-latest'];
  if (f && f.name) $('follow-name').textContent = f.name;
  if (t && t.name) $('donate-name').textContent = donateText(t.name, t.amount);

  startFx();
});

window.addEventListener('onEventReceived', (obj) => {
  const l = obj.detail.listener;
  const e = obj.detail.event || {};

  // botões de teste no editor do StreamElements
  if (l === 'widget-button') {
    if (e.field === 'testFollow') follow('Aventureiro');
    if (e.field === 'testDonate') donate('DoadorRed', 25, 'Bora RedOT!');
    return;
  }
  const name = e.name || e.displayName || 'Aventureiro';
  if (l === 'follower-latest') follow(name);
  else if (l === 'tip-latest') donate(name, e.amount, e.message);
  else if (l === 'subscriber-latest' && fd.subAlerts !== 'no') push({ title: e.gifted ? 'SUB PRESENTEADO' : 'NOVO SUB', name });
  else if (l === 'cheer-latest' && fd.subAlerts !== 'no') push({ title: `${e.amount} BITS`, name });
  else if (l === 'raid-latest' && fd.subAlerts !== 'no') push({ title: `RAID DE ${e.amount}`, name });
});

function money(v) {
  const n = Number(v);
  if (!isFinite(n)) return '';
  return `${fd.currency ?? 'R$'} ${n.toLocaleString('pt-BR', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 })}`;
}
function donateText(name, amount) {
  return fd.showAmount === 'no' || amount == null ? name : `${name} · ${money(amount)}`;
}

function follow(name) {
  push({ title: fd.followAlertTitle || 'NOVO SEGUIDOR', name, after: () => setValue('follow-name', name) });
}
function donate(name, amount, message) {
  const title = (fd.donateAlertTitle || 'DONATE') + (amount != null && fd.showAmount !== 'no' ? ` · ${money(amount)}` : '');
  push({ title, name, msg: fd.showMessage === 'no' ? '' : (message || ''), after: () => setValue('donate-name', donateText(name, amount)) });
}

function setValue(id, text) {
  const el = $(id);
  el.textContent = text;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function push(a) {
  queue.push(a);
  if (!busy) next();
}

function next() {
  const a = queue.shift();
  const cam = $('cam');
  if (!a) { busy = false; return; }
  busy = true;
  if (fd.alerts === 'no') { if (a.after) a.after(); return next(); }
  $('alert-title').textContent = a.title;
  $('alert-name').textContent = a.name;
  $('alert-msg').textContent = a.msg || '';
  cam.classList.add('alerting');
  const secs = fd.alertDuration || 6;
  burst = secs * 60;
  setTimeout(() => {
    cam.classList.remove('alerting');
    if (a.after) a.after();
    setTimeout(next, 900);
  }, secs * 1000);
}

/* ---------------- fogo, brasas e bolas de fogo ---------------- */
function sprite(stops, size = 64) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => grd.addColorStop(o, col));
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
}

function startFx() {
  const cv = $('fx');
  const ctx = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  const fire = (cs.getPropertyValue('--fire').trim() || '#ff4a1c');

  // paleta de chama: núcleo amarelo → laranja → cor do fogo → fumaça escura
  const flame = [
    sprite([[0, '#fff6d0'], [.3, '#ffd36acc'], [1, '#ffb00000']]),
    sprite([[0, '#ffb347'], [.4, '#ff7a1fbb'], [1, '#ff4a1c00']]),
    sprite([[0, fire], [.45, fire + 'aa'], [1, fire + '00']]),
    sprite([[0, '#5a0d06aa'], [1, '#2a050300']]),
  ];
  const ember = sprite([[0, '#fffbe6'], [.2, '#ffcf5a'], [.5, '#ff6a1a66'], [1, '#ff3a0000']], 32);

  let W = 0, H = 0, dpr = 1, fr, lg, bar;
  const measure = () => {
    dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const base = cv.getBoundingClientRect();
    const rel = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height }; };
    fr = rel($('frame'));
    lg = rel($('logo-img'));
    bar = rel($('bar'));
  };
  measure();
  window.addEventListener('resize', measure);
  $('logo-img').addEventListener('load', measure);

  const parts = [];
  const density = (fd.emberDensity ?? 5) / 5;
  const flameDensity = (fd.flameDensity ?? 5) / 5;

  // ponto aleatório na faixa dourada da moldura
  const framePoint = () => {
    const { x, y, w, h } = fr;
    const t = Math.random() * (2 * w + 2 * h);
    if (t < w) return [x + t, y];
    if (t < w + h) return [x + w, y + t - w];
    if (t < 2 * w + h) return [x + 2 * w + h - t, y + h];
    return [x, y + 2 * (w + h) - t];
  };

  const spawnEmber = (power) => {
    const [x, y] = Math.random() < .15
      ? [bar.x + Math.random() * bar.w, bar.y + bar.h * .2]   // algumas saem da barra
      : framePoint();
    parts.push({
      kind: 'ember', x, y,
      vx: (Math.random() - .5) * .5 * power, vy: -(Math.random() * .7 + .25) * power,
      size: (Math.random() * 3 + 2) * (W / 1000) * (power > 1 ? 1.4 : 1),
      life: 1, decay: Math.random() * .006 + .004, seed: Math.random() * 1000,
    });
  };

  // chamas atrás do logo (em cima da pedra/raposa), como no banner
  const spawnFlame = (power) => {
    const a = Math.PI * (1.15 + Math.random() * .7);           // arco superior (pedra + raposa)
    const cx = lg.x + lg.w / 2, cy = lg.y + lg.h * .5;
    const x = cx + Math.cos(a) * lg.w * .36;
    const y = cy + Math.sin(a) * lg.h * .44 + lg.h * .06;
    parts.push({
      kind: 'flame', x, y,
      vx: Math.cos(a) * .18, vy: -(Math.random() * .5 + .45) * power,
      size: (Math.random() * 14 + 14) * (W / 1000) * (.85 + power * .25),
      life: 1, decay: Math.random() * .01 + .018, seed: Math.random() * 1000,
    });
  };

  // bolas de fogo correndo pela barra (no lugar dos planetas do DeusOT)
  const orbs = [0, .37, .71].map((p, i) => ({ p, speed: .00055 + i * .00012, size: 1 + (i % 2) * .4 }));

  let t = 0, last = 0, accE = 0, accF = 0;
  (function loop(now = 0) {
    const dt = last ? Math.min((now - last) / 16.67, 3) : 1;
    last = now; t += dt;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const boosting = burst > 0;
    if (boosting) burst = Math.max(0, burst - dt);
    const power = boosting ? 1.7 : 1;

    accE += (2 * (fr.w + fr.h)) / 900 * .55 * density * (boosting ? 2.5 : 1) * dt;
    while (accE >= 1) { spawnEmber(power); accE--; }
    if (fd.logoFlames !== 'no') {
      accF += 2.2 * flameDensity * (boosting ? 2.6 : 1) * dt;
      while (accF >= 1) { spawnFlame(power); accF--; }
    }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += (p.vx + Math.sin((t + p.seed) * .05) * (p.kind === 'flame' ? .35 : .4)) * dt;
      p.y += p.vy * dt;
      p.vy -= (p.kind === 'flame' ? .012 : .003) * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      if (p.kind === 'ember') {
        const s = p.size * (.5 + p.life * .5) * (1 + Math.sin((t + p.seed) * .3) * .25);
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.drawImage(ember, p.x - s * 2, p.y - s * 2, s * 4, s * 4);
      } else {
        const stage = p.life > .8 ? 0 : p.life > .55 ? 1 : p.life > .25 ? 2 : 3;
        if (stage === 3) ctx.globalCompositeOperation = 'source-over';
        const s = p.size * (stage === 3 ? 1.3 : .6 + (1 - p.life) * .7);
        ctx.globalAlpha = (stage === 3 ? p.life * 1.2 : .38) * (stage === 0 ? .8 : 1);
        ctx.setTransform(dpr, 0, 0, dpr, p.x * dpr, p.y * dpr);
        ctx.drawImage(flame[stage], -s * .45, -s * .7, s * .9, s * 1.4);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = 'lighter';
      }
    }

    // bolas de fogo com rastro correndo na borda de cima da barra
    if (fd.barOrbs !== 'no') {
      const y0 = bar.y + bar.h * .02;
      for (const o of orbs) {
        o.p = (o.p + o.speed * dt * (boosting ? 3 : 1)) % 1;
        const x = bar.x + o.p * bar.w;
        const fade = Math.min(1, o.p * 12, (1 - o.p) * 12);
        const r = 9 * (W / 1000) * o.size;
        for (let k = 10; k >= 0; k--) {
          const tx = x - k * r * .55, ty = y0 + Math.sin((t * .08) + k * .5) * r * .12;
          ctx.globalAlpha = fade * (1 - k / 11) * .5;
          ctx.drawImage(flame[k < 3 ? 1 : 2], tx - r * (1 - k / 16), ty - r * (1 - k / 16), r * 2 * (1 - k / 16), r * 2 * (1 - k / 16));
        }
        ctx.globalAlpha = fade;
        ctx.drawImage(ember, x - r * 1.6, y0 - r * 1.6, r * 3.2, r * 3.2);
        if (Math.random() < .15 * dt) parts.push({ kind: 'ember', x, y: y0, vx: -.3, vy: -Math.random() * .6 - .2, size: 2 * (W / 1000), life: .8, decay: .02, seed: Math.random() * 1000 });
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(loop);
  })();
}
</script>
<script>
// valores padrão dos campos; obs-connect.js liga no StreamElements com #token=JWT
// (?seguidor=Nome&donate=Nome&valor=10 preenche a barra; ?demo testa alertas em loop)
window.REDOT_DEFAULTS = {"followLabel": "ÚLTIMO SEGUIDOR:", "donateLabel": "ÚLTIMO DONATE:", "currency": "R$", "showAmount": "yes", "showPartner": "yes", "barOrbs": "yes", "alerts": "yes", "followAlertTitle": "NOVO SEGUIDOR", "donateAlertTitle": "DONATE", "showMessage": "yes", "subAlerts": "yes", "alertDuration": 6, "logoSize": 230, "partnerSize": 118, "logoImage": "", "partnerImage": "", "fireColor": "#ff4a1c", "goldColor": "#f2c45a", "logoFlames": "yes", "flameDensity": 5, "emberDensity": 5};
// Modo OBS direto: lê o token JWT do StreamElements no link (#token=...)
// e recebe seguidores/donates em tempo real, sem precisar de widget.
(function () {
  const params = new URLSearchParams(location.search + '&' + location.hash.slice(1));
  const token = params.get('token');
  const fieldData = window.REDOT_DEFAULTS;
  const fire = (listener, event) => window.dispatchEvent(new CustomEvent('onEventReceived', { detail: { listener, event } }));

  // últimos valores: link > memória do OBS > vazio
  const mem = (k) => { try { return JSON.parse(localStorage.getItem('redot-' + k)); } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem('redot-' + k, JSON.stringify(v)); } catch (e) {} };
  const data = {
    'follower-latest': params.get('seguidor') ? { name: params.get('seguidor') } : mem('follow') || { name: '—' },
    'tip-latest': params.get('donate') ? { name: params.get('donate'), amount: params.get('valor') } : mem('tip') || { name: '—' },
  };
  window.dispatchEvent(new CustomEvent('onWidgetLoad', { detail: { fieldData, session: { data } } }));

  window.addEventListener('message', (e) => e.data && e.data.listener && fire(e.data.listener, e.data.event));
  if (params.has('demo')) {
    const demo = () => {
      fire('follower-latest', { name: 'CavaleiroRed' });
      fire('tip-latest', { name: 'DruidaBR', amount: 50, message: 'Bora RedOT! Vamo pra cima!' });
    };
    setTimeout(demo, 2500); setInterval(demo, 25000);
  }
  if (!token) return;

  // busca o último seguidor/donate salvos no StreamElements
  const api = (path) => fetch('https://api.streamelements.com/kappa/v2/' + path, { headers: { Authorization: 'Bearer ' + token } }).then((r) => r.json());
  api('channels/me').then((ch) => api('sessions/' + ch._id)).then((s) => {
    const d = (s && s.data) || {};
    const f = d['follower-latest'], t = d['tip-latest'];
    if (f && f.name) { document.getElementById('follow-name').textContent = f.name; save('follow', f); }
    if (t && t.name) { document.getElementById('donate-name').textContent = donateText(t.name, t.amount); save('tip', t); }
  }).catch(() => {});

  // tempo real (StreamElements Astro)
  const TYPES = { follow: 'follower-latest', tip: 'tip-latest', subscriber: 'subscriber-latest', cheer: 'cheer-latest', raid: 'raid-latest' };
  let wait = 2000;
  (function connect() {
    const ws = new WebSocket('wss://astro.streamelements.com');
    ws.onopen = () => {
      wait = 2000;
      ws.send(JSON.stringify({ type: 'subscribe', nonce: String(Date.now()), data: { topic: 'channel.activities', token, token_type: 'jwt' } }));
    };
    ws.onmessage = (m) => {
      let msg; try { msg = JSON.parse(m.data); } catch (e) { return; }
      if (msg.type === 'response' && msg.error) console.warn('[RedOT] StreamElements recusou o token:', msg.error);
      if (msg.type !== 'message' || !msg.data) return;
      const listener = TYPES[msg.data.type];
      if (!listener) return;
      const d = msg.data.data || {};
      const event = { name: d.displayName || d.username || 'Aventureiro', amount: d.amount, message: d.message, gifted: d.gifted };
      if (listener === 'follower-latest') save('follow', { name: event.name });
      if (listener === 'tip-latest') save('tip', { name: event.name, amount: event.amount });
      fire(listener, event);
    };
    ws.onclose = () => { setTimeout(connect, wait); wait = Math.min(wait * 2, 60000); };
  })();
})();

</script>
